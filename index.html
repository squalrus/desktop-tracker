<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Virtual Desktop Time</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <style>
      :root {
        --bg: #f3f4f6;
        --text: #1f2937;
        --muted: #6b7280;
        --card-bg: #ffffff;
        --shadow: rgba(0,0,0,0.06);
        --border: #e5e7eb;
        --bar-bg: #e5e7eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --text: #f3f4f6;
          --muted: #9ca3af;
          --card-bg: #1f2937;
          --shadow: rgba(0,0,0,0.3);
          --border: #374151;
          --bar-bg: #374151;
        }
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 32px;
      }

      /* Page header */
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 36px;
      }
      .title-group { display: flex; align-items: center; gap: 10px; }
      .title-icon  { width: 28px; height: 28px; flex-shrink: 0; }
      h1 { margin: 0; font-size: 1.4em; }

      /* Footer */
      .page-footer {
        margin-top: 48px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        font-size: 0.74em;
        color: var(--muted);
      }
      .page-footer a { color: var(--muted); text-decoration: none; }
      .page-footer a:hover { color: var(--text); }
      .controls { display: flex; gap: 8px; align-items: center; }
      .controls input, .controls button {
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--text);
        font-size: 0.88em;
        cursor: pointer;
      }
      .controls button:hover { background: #3b82f6; color: #fff; border-color: #3b82f6; }
      .date-nav { display: flex; gap: 4px; align-items: center; }
      .date-nav .nav-arrow { padding: 7px 9px; font-size: 1.15em; }
      .date-nav #go-today:disabled { opacity: 0.38; cursor: default; pointer-events: none; }
      #date-picker::-webkit-calendar-picker-indicator,
      .settings-row input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }

      /* Sections */
      .view-section { margin-bottom: 44px; }
      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 2px solid var(--border);
        padding-bottom: 8px;
        margin-bottom: 16px;
      }
      .section-label {
        font-size: 0.7em;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
      }
      .section-sublabel {
        font-size: 0.82em;
        color: var(--muted);
        margin-left: 10px;
        font-weight: normal;
      }
      .section-total { font-size: 0.9em; color: var(--muted); }

      /* Day layout — cards left, donut right */
      .day-body { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
      .day-cards {
        flex: 1;
        min-width: 220px;
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        align-content: start;
      }

      /* Week / Month cards */
      .period-cards {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        margin-bottom: 16px;
      }

      /* Cards */
      .card {
        background: var(--card-bg);
        border-radius: 10px;
        padding: 14px 16px;
        box-shadow: 0 1px 3px var(--shadow);
        border-left: 4px solid var(--card-accent, #3b82f6);
      }
      .card-name {
        font-size: 0.78em;
        font-weight: 700;
        color: var(--card-accent, #3b82f6);
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-time {
        font-size: 1.5em;
        font-weight: 700;
        color: var(--text);
        line-height: 1.1;
        margin-bottom: 6px;
      }
      .card-meta-group { margin-bottom: 9px; }
      .card-meta { font-size: 0.74em; color: var(--muted); line-height: 1.6; }
      .bar-track {
        background: var(--bar-bg);
        border-radius: 3px;
        height: 5px;
        overflow: hidden;
        margin-bottom: 5px;
      }
      .bar-fill {
        height: 100%;
        background: var(--card-accent, #3b82f6);
        border-radius: 3px;
        transition: width 0.4s;
      }
      .card-pct { font-size: 0.72em; color: var(--muted); text-align: right; }
      .bar-fill.over { background: #10b981; }

      /* Per-desktop target rows in settings panel */
      .target-desktop-rows { margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }
      .target-desktop-row  { display: flex; align-items: center; gap: 12px; }
      .target-desktop-label { font-size: 0.84em; color: var(--muted); width: 130px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .target-desktop-input { width: 64px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.86em; text-align: right; }
      .target-desktop-unit  { font-size: 0.82em; color: var(--muted); }

      /* Charts */
      .chart-wrap { margin-top: 4px; }
      .chart-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-bottom: 8px;
        font-size: 0.76em;
        color: var(--muted);
      }
      .legend-dot {
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 2px;
        margin-right: 4px;
        vertical-align: middle;
      }
      .no-data { color: var(--muted); font-size: 0.88em; padding: 4px 0; }

      /* Target progress row */
      .target-row { margin-bottom: 14px; }
      .target-bar-wrap {
        background: var(--bar-bg); border-radius: 4px;
        height: 7px; overflow: hidden; margin-bottom: 5px;
      }
      .target-bar-fill {
        height: 100%; background: #3b82f6;
        border-radius: 4px; transition: width 0.4s;
      }
      .target-bar-fill.over { background: #10b981; }
      .target-text  { font-size: 0.76em; color: var(--muted); }
      .target-over  { color: #10b981; font-weight: 600; }
      .target-weekend { font-size: 0.76em; color: var(--muted); font-style: italic; }

      /* Desktop filter dropdown */
      .filter-wrap { position: relative; display: inline-block; }
      .filter-btn {
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--text);
        font-size: 0.88em;
        cursor: pointer;
        white-space: nowrap;
        user-select: none;
      }
      .filter-btn:hover  { background: #3b82f6; color: #fff; border-color: #3b82f6; }
      .filter-btn.active { border-color: #3b82f6; color: #3b82f6; }
      .filter-panel {
        display: none;
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        min-width: 180px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 4px 12px var(--shadow);
        z-index: 200;
        padding: 6px 0;
      }
      .filter-panel.open { display: block; }
      .filter-opt {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        font-size: 0.84em;
        cursor: pointer;
        user-select: none;
      }
      .filter-opt:hover { background: var(--bar-bg); }
      .filter-opt input { cursor: pointer; accent-color: #3b82f6; }
      .filter-hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

      /* BambooHR settings panel */
      .icon-btn {
        background: none;
        border: 1px solid transparent;
        cursor: pointer;
        padding: 5px 7px;
        border-radius: 6px;
        color: var(--muted);
        font-size: 1.05em;
        line-height: 1;
      }
      .icon-btn:hover { color: var(--text); border-color: var(--border); }

      .settings-panel {
        display: none;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px 24px;
        margin-bottom: 32px;
        box-shadow: 0 2px 8px var(--shadow);
      }
      .settings-panel.open {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
        gap: 24px 36px;
      }
      .settings-section h3 {
        margin: 0 0 14px;
        font-size: 0.75em;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .settings-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
      .settings-row > label:first-child { width: 130px; font-size: 0.84em; color: var(--muted); flex-shrink: 0; }
      .settings-row input[type="text"],
      .settings-row input[type="password"],
      .settings-row input[type="date"],
      .settings-row input[type="number"] {
        flex: 1; max-width: 300px; padding: 6px 10px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--bg);
        color: var(--text); font-size: 0.86em;
      }
      .settings-row select {
        padding: 6px 10px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--bg);
        color: var(--text); font-size: 0.86em;
      }
      .settings-row.settings-row-flush { padding-left: 142px; }
      .settings-row > label.settings-check {
        display: flex; align-items: center; gap: 8px;
        font-size: 0.86em; color: var(--text); cursor: pointer; width: auto;
      }
      .settings-check input { accent-color: #3b82f6; cursor: pointer; }
      .input-with-toggle { display: flex; gap: 6px; flex: 1; max-width: 300px; }
      .input-with-toggle input { max-width: unset; flex: 1; }
      .btn-toggle { display: flex; gap: 0; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
      .btn-toggle-opt {
        padding: 5px 14px; border: none; background: var(--card-bg); color: var(--muted);
        font-size: 0.84em; cursor: pointer; transition: background 0.15s, color 0.15s;
      }
      .btn-toggle-opt:not(:last-child) { border-right: 1px solid var(--border); }
      .btn-toggle-opt.active { background: #3b82f6; color: #fff; }
      .settings-actions {
        display: flex; align-items: center; gap: 8px;
        margin-top: 14px; padding-left: 142px; flex-wrap: wrap;
      }
      .settings-actions button {
        padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
        background: var(--card-bg); color: var(--text); font-size: 0.84em; cursor: pointer;
      }
      .settings-actions button:hover { background: #3b82f6; color: #fff; border-color: #3b82f6; }
      .mapping-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
      .mapping-label {
        width: 130px; font-size: 0.84em; color: var(--muted); flex-shrink: 0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .mapping-select {
        flex: 1; max-width: 280px; padding: 5px 8px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--bg);
        color: var(--text); font-size: 0.84em;
      }
      .settings-status { font-size: 0.82em; }
      .status-ok    { color: #10b981; }
      .status-error { color: #ef4444; }
      .status-info  { color: var(--muted); }

      /* Sync button + status badge */
      .sync-area { display: flex; align-items: center; gap: 10px; }
      .sync-btn {
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--text);
        font-size: 0.82em;
        cursor: pointer;
        white-space: nowrap;
      }
      .sync-btn:hover:not(:disabled) { background: #3b82f6; color: #fff; border-color: #3b82f6; }
      .sync-btn:disabled { opacity: 0.55; cursor: default; }
      .sync-status       { font-size: 0.76em; color: var(--muted); white-space: nowrap; }
      .sync-status.ok    { color: #10b981; }
      .sync-status.partial { color: #f59e0b; }
      .sync-status.err   { color: #ef4444; }
    </style>
  </head>
  <body>

    <div class="page-header">
      <div class="title-group">
        <svg class="title-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
          <rect x="10" y="10" width="60" height="60" rx="8" fill="#93c5fd" opacity="0.8" />
          <rect x="30" y="30" width="60" height="60" rx="8" fill="#0078D7" />
          <circle cx="60" cy="60" r="18" fill="#ffffff" />
          <path d="M 60 48 L 60 60 L 68 64" fill="none" stroke="#0078D7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <h1>Desktop Usage</h1>
      </div>
      <div class="controls">
        <div class="date-nav">
          <button id="prev-day" class="nav-arrow" title="Previous day">&#8249;</button>
          <input type="date" id="date-picker" />
          <button id="next-day" class="nav-arrow" title="Next day">&#8250;</button>
          <button id="go-today">Today</button>
        </div>
        <div class="filter-wrap" id="filter-wrap">
          <button class="filter-btn" id="filter-btn">All Desktops ▾</button>
          <div class="filter-panel" id="filter-panel">
            <label class="filter-opt">
              <input type="checkbox" id="filter-all" checked />
              <strong>All Desktops</strong>
            </label>
            <hr class="filter-hr" />
            <div id="filter-options"></div>
          </div>
        </div>
        <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
      </div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="settings-panel">
      <div class="settings-section">
        <h3>Hour Targets</h3>
        <div class="settings-row">
          <label for="t-type">Period</label>
          <select id="t-type">
            <option value="day">Day</option>
            <option value="week" selected>Week</option>
            <option value="month">Month</option>
          </select>
        </div>
        <div class="settings-row settings-row-flush">
          <label class="settings-check">
            <input type="checkbox" id="t-weekends" />
            Exclude weekends from averages and target progress
          </label>
        </div>
        <div id="t-desktop-rows" class="target-desktop-rows"></div>
        <div class="settings-actions">
          <button id="targets-save">Save</button>
          <span id="targets-saved" class="settings-status status-ok" style="display:none">Saved ✓</span>
        </div>
      </div>
      <div class="settings-section">
        <h3>Adjust Time</h3>
        <div class="settings-row">
          <label>Mode</label>
          <div class="btn-toggle">
            <button id="adj-mode-transfer" class="btn-toggle-opt active">Transfer</button>
            <button id="adj-mode-add"      class="btn-toggle-opt">Add</button>
          </div>
        </div>
        <div class="settings-row">
          <label for="adj-date">Date</label>
          <input id="adj-date" type="date" />
        </div>
        <div class="settings-row" id="adj-from-row">
          <label for="adj-from">From</label>
          <select id="adj-from" class="mapping-select" style="max-width:260px"></select>
        </div>
        <div class="settings-row">
          <label for="adj-to" id="adj-to-label">To</label>
          <select id="adj-to" class="mapping-select" style="max-width:260px"></select>
        </div>
        <div class="settings-row">
          <label for="adj-minutes">Minutes</label>
          <input id="adj-minutes" type="number" min="1" step="1" placeholder="15" style="max-width:120px" />
        </div>
        <div class="settings-actions">
          <button id="adj-move">Move</button>
          <span id="adj-status" class="settings-status"></span>
        </div>
      </div>
      <div class="settings-section">
        <h3>Export</h3>
        <div class="settings-actions" style="padding-left:0; margin-top:0">
          <button id="export-btn">Export CSV</button>
          <span class="settings-status status-info">Download your full history as a spreadsheet.</span>
        </div>
      </div>
      <div class="settings-section">
        <h3>BambooHR Integration</h3>
        <div class="settings-row">
          <label for="bh-domain">Company Domain</label>
          <input id="bh-domain" type="text" placeholder="mycompany" autocomplete="off" />
        </div>
        <div class="settings-row">
          <label for="bh-apikey">API Key</label>
          <div class="input-with-toggle">
            <input id="bh-apikey" type="password" placeholder="Your BambooHR API key" autocomplete="off" />
            <button id="bh-reveal" class="icon-btn" title="Show / hide key">👁</button>
          </div>
        </div>
        <div class="settings-row">
          <label for="bh-rounding">Time Rounding</label>
          <select id="bh-rounding" class="mapping-select" style="max-width:220px">
            <option value="15min">15 minutes (0.25h)</option>
            <option value="6min">6 minutes (0.1h)</option>
            <option value="exact">Exact decimal</option>
          </select>
        </div>
        <div class="settings-actions">
          <button id="bh-save-creds">Save</button>
          <button id="bh-test">Test Connection</button>
          <span id="bh-status" class="settings-status"></span>
        </div>
      </div>
      <div class="settings-section" id="mapping-section" style="display:none">
        <h3>Desktop → Project Mapping</h3>
        <div id="mapping-rows"></div>
        <div class="settings-actions">
          <button id="bh-save-mappings">Save Mappings</button>
          <span id="bh-map-status" class="settings-status"></span>
        </div>
      </div>
    </div>

    <!-- Day -->
    <div class="view-section">
      <div class="section-header">
        <div>
          <span class="section-label">Day</span>
          <span id="day-sublabel" class="section-sublabel"></span>
        </div>
        <div class="sync-area">
          <span id="sync-status" class="sync-status"></span>
          <button id="sync-btn" class="sync-btn" style="display:none">Sync to BambooHR</button>
        </div>
        <span id="day-total" class="section-total"></span>
      </div>
      <div id="day-target" class="target-row"></div>
      <div class="day-body">
        <div class="day-cards" id="day-cards"></div>
        <div id="day-donut"></div>
      </div>
    </div>

    <!-- Week -->
    <div class="view-section">
      <div class="section-header">
        <div>
          <span class="section-label">Week</span>
          <span id="week-sublabel" class="section-sublabel"></span>
        </div>
        <span id="week-total" class="section-total"></span>
      </div>
      <div id="week-target" class="target-row"></div>
      <div class="period-cards" id="week-cards"></div>
      <div class="chart-wrap" id="week-chart"></div>
    </div>

    <!-- Month -->
    <div class="view-section">
      <div class="section-header">
        <div>
          <span class="section-label">Month</span>
          <span id="month-sublabel" class="section-sublabel"></span>
        </div>
        <span id="month-total" class="section-total"></span>
      </div>
      <div id="month-target" class="target-row"></div>
      <div class="period-cards" id="month-cards"></div>
      <div class="chart-wrap" id="month-chart"></div>
    </div>

    <script>
      const PALETTE = ['#3b82f6','#10b981','#f59e0b','#8b5cf6','#ef4444','#06b6d4','#f97316','#84cc16'];

      let globalData = {};
      let colorMap   = {};

      // Assign a consistent color per desktop name across all sections
      function buildColorMap() {
        const names = new Set();
        for (const d of Object.values(globalData))
          for (const k of Object.keys(d)) names.add(k);
        colorMap = {};
        [...names].sort().forEach((n, i) => colorMap[n] = PALETTE[i % PALETTE.length]);
      }

      function formatTime(s) {
        s = Math.round(s);
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        let t = '';
        if (h > 0) t += h + 'h ';
        if (m > 0 || h > 0) t += m + 'm ';
        t += sec + 's';
        return t.trim();
      }

      function fmtDate(dateStr) {
        return new Date(dateStr + 'T00:00:00')
          .toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      }

      // ── Card ──────────────────────────────────────────────────────────
      function makeCard(desktop, seconds, totalSeconds, metaText, targetH) {
        const color = colorMap[desktop] || PALETTE[0];

        const card = document.createElement('div');
        card.className = 'card';
        card.style.setProperty('--card-accent', color);

        const name = document.createElement('div');
        name.className = 'card-name';
        name.textContent = desktop;

        const time = document.createElement('div');
        time.className = 'card-time';
        time.textContent = formatTime(seconds);

        // Bar: target-based when a target is set, otherwise % of period total
        let barPct, pctLabel, fillOver = false;
        if (targetH && targetH > 0) {
          barPct   = Math.min(100, (seconds / (targetH * 3600)) * 100);
          fillOver = seconds >= targetH * 3600;
          pctLabel = fillOver
            ? `✓ over ${fmtH(targetH)}`
            : `${Math.round(barPct)}% of ${fmtH(targetH)}`;
        } else {
          barPct   = totalSeconds > 0 ? (seconds / totalSeconds) * 100 : 0;
          pctLabel = barPct.toFixed(1) + '%';
        }

        const track = document.createElement('div');
        track.className = 'bar-track';
        const fill = document.createElement('div');
        fill.className = 'bar-fill' + (fillOver ? ' over' : '');
        fill.style.width = barPct.toFixed(1) + '%';
        track.appendChild(fill);

        const p = document.createElement('div');
        p.className = 'card-pct';
        p.textContent = pctLabel;

        card.appendChild(name);
        card.appendChild(time);
        if (metaText) {
          const lines = Array.isArray(metaText) ? metaText : [metaText];
          const group = document.createElement('div');
          group.className = 'card-meta-group';
          for (const line of lines) {
            const meta = document.createElement('div');
            meta.className = 'card-meta';
            meta.textContent = line;
            group.appendChild(meta);
          }
          card.appendChild(group);
        }
        card.appendChild(track);
        card.appendChild(p);
        return card;
      }

      // ── SVG helper ────────────────────────────────────────────────────
      function svgEl(tag, attrs) {
        const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
      }

      // ── Donut chart ───────────────────────────────────────────────────
      // Each ring segment uses stroke-dasharray + stroke-dashoffset.
      // dashoffset = circ/4 − cumulative so segments start at 12 o'clock.
      function renderDonut(container, data, target = 0) {
        container.innerHTML = '';
        const entries = Object.entries(data).sort(([a],[b]) => a.localeCompare(b));
        const total   = entries.reduce((s,[,v]) => s + v, 0);
        if (total === 0) return;

        const size = 160, cx = 80, cy = 80, r = 54, sw = 20;
        const circ  = 2 * Math.PI * r;

        const svg = svgEl('svg', { viewBox: `0 0 ${size} ${size}` });
        svg.style.cssText = 'width:160px;height:160px;flex-shrink:0';

        svg.appendChild(svgEl('circle', {
          cx, cy, r, fill: 'none', stroke: 'var(--bar-bg)', 'stroke-width': sw
        }));

        let cum = 0;
        for (const [desktop, seconds] of entries) {
          const dash = (seconds / total) * circ;
          const seg  = svgEl('circle', {
            cx, cy, r, fill: 'none',
            stroke: colorMap[desktop] || PALETTE[0],
            'stroke-width': sw,
            'stroke-dasharray': `${dash} ${circ - dash}`,
            'stroke-dashoffset': circ * 0.25 - cum,
          });
          const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
          title.textContent = `${desktop}: ${formatTime(seconds)} (${((seconds/total)*100).toFixed(1)}%)`;
          seg.appendChild(title);
          svg.appendChild(seg);
          cum += dash;
        }

        const tBig = svgEl('text', {
          x: cx, y: cy - 6, 'text-anchor': 'middle',
          fill: 'var(--text)', 'font-size': '13', 'font-weight': 'bold',
          'font-family': 'Segoe UI,sans-serif'
        });
        tBig.textContent = formatTime(total);
        svg.appendChild(tBig);

        const overTarget = target > 0 && total >= target;
        const subText = target > 0
          ? `of ${fmtH(target / 3600)} · ${Math.round((total / target) * 100)}%`
          : 'today';
        const tSub = svgEl('text', {
          x: cx, y: cy + 11, 'text-anchor': 'middle',
          fill: overTarget ? '#10b981' : 'var(--muted)',
          'font-size': '9', 'font-family': 'Segoe UI,sans-serif'
        });
        tSub.textContent = subText;
        svg.appendChild(tSub);

        container.appendChild(svg);
      }

      // ── Stacked bar chart ─────────────────────────────────────────────
      // days = [{ label, totals: {desktop: seconds}, isSelected?, target?, isPast? }]
      //   target  — daily target in seconds (0/missing = no tick, no fade)
      //   isPast  — true for days strictly before today; missed-target bars are faded
      function renderBarChart(container, days, compact) {
        container.innerHTML = '';
        const allDesktops = [...new Set(days.flatMap(d => Object.keys(d.totals)))].sort();
        if (allDesktops.length === 0) return;

        const legend = document.createElement('div');
        legend.className = 'chart-legend';
        for (const name of allDesktops) {
          const dot = document.createElement('span');
          dot.className = 'legend-dot';
          dot.style.background = colorMap[name] || PALETTE[0];
          const item = document.createElement('span');
          item.appendChild(dot);
          item.appendChild(document.createTextNode(name));
          legend.appendChild(item);
        }
        container.appendChild(legend);

        const W = 560, H = compact ? 150 : 175;
        const ml = 6, mr = 6, mt = 8, mb = 28;
        const plotW = W - ml - mr, plotH = H - mt - mb;
        const n    = days.length;
        const gap  = n > 20 ? 2 : n > 10 ? 3 : 5;
        const barW = Math.max(4, (plotW - gap * (n - 1)) / n);
        // Include targets in maxTotal so the tick stays inside the plot area
        // even when every bar is below target.
        const maxTotal = Math.max(
          ...days.map(d => Object.values(d.totals).reduce((s,v) => s+v, 0)),
          ...days.map(d => d.target || 0),
          1
        );

        const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}` });
        svg.style.cssText = 'width:100%;max-width:560px;display:block';

        // Baseline
        svg.appendChild(svgEl('line', {
          x1: ml, y1: mt + plotH, x2: W - mr, y2: mt + plotH,
          stroke: 'var(--border)', 'stroke-width': 1
        }));

        for (let i = 0; i < n; i++) {
          const { label, totals, isSelected, target = 0, isPast = false } = days[i];
          const x        = ml + i * (barW + gap);
          const dayTotal = Object.values(totals).reduce((s,v) => s+v, 0);
          const missed   = target > 0 && isPast && dayTotal < target;

          const barGroup = svgEl('g', missed ? { opacity: '0.45' } : {});

          if (dayTotal === 0) {
            barGroup.appendChild(svgEl('rect', {
              x, y: mt + plotH - 2, width: barW, height: 2,
              fill: 'var(--bar-bg)', rx: 1
            }));
          } else {
            let yOff = mt + plotH;
            for (const desktop of Object.keys(totals).sort()) {
              const bh   = (totals[desktop] / maxTotal) * plotH;
              yOff -= bh;
              const rect = svgEl('rect', {
                x, y: yOff, width: barW, height: bh,
                fill: colorMap[desktop] || PALETTE[0], rx: 2
              });
              const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
              title.textContent = `${label} · ${desktop}: ${formatTime(totals[desktop])}`;
              rect.appendChild(title);
              barGroup.appendChild(rect);
            }
          }
          svg.appendChild(barGroup);

          // Per-bar target tick — drawn over the bar so it stays visible
          // whether the bar exceeded the target or fell short.
          if (target > 0) {
            const tickY = mt + plotH - Math.min(target / maxTotal, 1) * plotH;
            const tick  = svgEl('line', {
              x1: x, y1: tickY, x2: x + barW, y2: tickY,
              stroke: '#10b981', 'stroke-width': 2, opacity: 0.9
            });
            const tickTitle = document.createElementNS('http://www.w3.org/2000/svg', 'title');
            tickTitle.textContent = `Target: ${fmtH(target / 3600)}`;
            tick.appendChild(tickTitle);
            svg.appendChild(tick);
          }

          // Underline the selected day
          if (isSelected) {
            svg.appendChild(svgEl('rect', {
              x, y: mt + plotH + 5, width: barW, height: 3, fill: '#3b82f6', rx: 1
            }));
          }

          const fs = n > 20 ? '7' : '9';
          const t  = svgEl('text', {
            x: x + barW / 2, y: H - 5, 'text-anchor': 'middle',
            'font-size': fs,
            fill: isSelected ? 'var(--text)' : 'var(--muted)',
            'font-weight': isSelected ? 'bold' : 'normal',
            'font-family': 'Segoe UI,sans-serif'
          });
          t.textContent = label;
          svg.appendChild(t);
        }

        container.appendChild(svg);
      }

      // ── Date helpers ──────────────────────────────────────────────────
      function todayStr() {
        const d = new Date();
        return d.getFullYear() + '-' +
          String(d.getMonth() + 1).padStart(2, '0') + '-' +
          String(d.getDate()).padStart(2, '0');
      }

      function getWeekDays(dateStr) {
        const d   = new Date(dateStr + 'T00:00:00');
        const mon = new Date(d);
        mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
        return Array.from({ length: 7 }, (_, i) => {
          const day = new Date(mon);
          day.setDate(mon.getDate() + i);
          return day.getFullYear() + '-' +
            String(day.getMonth() + 1).padStart(2, '0') + '-' +
            String(day.getDate()).padStart(2, '0');
        });
      }

      function getMonthDays(dateStr) {
        const [y, m] = dateStr.split('-').map(Number);
        const count  = new Date(y, m, 0).getDate();
        return Array.from({ length: count }, (_, i) =>
          `${y}-${String(m).padStart(2,'0')}-${String(i + 1).padStart(2,'0')}`);
      }

      function trackedCount(days) {
        return days.filter(d => {
          if (targetConfig.excludeWeekends && isWeekend(d)) return false;
          const vals = Object.values(applyFilter(globalData[d] || {}));
          return vals.reduce((s,x) => s+x, 0) > 0;
        }).length;
      }

      // ── Render: Day ───────────────────────────────────────────────────
      function renderDay(sel) {
        const data  = applyFilter(globalData[sel] || {});
        const total = Object.values(data).reduce((s,v) => s+v, 0);

        document.getElementById('day-sublabel').textContent = fmtDate(sel);
        document.getElementById('day-total').textContent =
          total > 0 ? `Total: ${formatTime(total)}` : '';

        const el = document.getElementById('day-cards');
        el.innerHTML = '';

        // Section header target — aggregate only desktops that have a target
        const tEl = document.getElementById('day-target');
        if (targetConfig.excludeWeekends && isWeekend(sel)) {
          tEl.innerHTML = '<div class="target-weekend">Weekend</div>';
        } else {
          const dWithTgt = Object.keys(data).filter(d => (targetConfig.desktops?.[d] || 0) > 0);
          if (dWithTgt.length > 0) {
            renderTargetRow(tEl,
              dWithTgt.reduce((s,d) => s + (data[d] || 0), 0),
              dWithTgt.reduce((s,d) => s + getTargetH(1, d), 0)
            );
          } else {
            tEl.innerHTML = '';
          }
        }

        if (total === 0) {
          const p = document.createElement('p');
          p.className = 'no-data';
          p.textContent = 'No data recorded for this day.';
          el.appendChild(p);
          document.getElementById('day-donut').innerHTML = '';
          updateSyncUI(sel);
          return;
        }

        const frag = document.createDocumentFragment();
        for (const [desktop, secs] of Object.entries(data).sort(([a],[b]) => a.localeCompare(b)))
          frag.appendChild(makeCard(desktop, secs, total, null, getTargetH(1, desktop)));
        el.appendChild(frag);

        // Donut target = sum of visible desktops' daily targets (0 on excluded weekends).
        const visDay = activeFilter.size > 0 ? [...activeFilter] : allDesktops();
        const dayTgtSecs = (targetConfig.excludeWeekends && isWeekend(sel))
          ? 0
          : visDay.reduce((s,d) => s + (getTargetH(1, d) || 0), 0) * 3600;
        renderDonut(document.getElementById('day-donut'), data, dayTgtSecs);
        updateSyncUI(sel);
      }

      // ── Render: Week ──────────────────────────────────────────────────
      function renderWeek(sel) {
        const days = getWeekDays(sel);
        const wpw  = targetConfig.excludeWeekends ? 5 : 7;

        // Aggregate all days for display
        const aggData = {};
        for (const d of days)
          for (const [k, v] of Object.entries(applyFilter(globalData[d] || {})))
            aggData[k] = (aggData[k] || 0) + v;

        // Aggregate working days only for target progress
        const wdData = {};
        for (const d of days) {
          if (targetConfig.excludeWeekends && isWeekend(d)) continue;
          for (const [k, v] of Object.entries(applyFilter(globalData[d] || {})))
            wdData[k] = (wdData[k] || 0) + v;
        }

        const total   = Object.values(aggData).reduce((s,v) => s+v, 0);
        const tracked = trackedCount(days);

        document.getElementById('week-sublabel').textContent =
          `${fmtDate(days[0])} – ${fmtDate(days[6])}`;
        document.getElementById('week-total').textContent =
          total > 0 ? `Total: ${formatTime(total)}` : '';

        // Section header target aggregate
        const dWithTgt = Object.keys(wdData).filter(d => (targetConfig.desktops?.[d] || 0) > 0);
        if (dWithTgt.length > 0) {
          renderTargetRow(document.getElementById('week-target'),
            dWithTgt.reduce((s,d) => s + (wdData[d] || 0), 0),
            dWithTgt.reduce((s,d) => s + getTargetH(wpw, d), 0)
          );
        } else {
          document.getElementById('week-target').innerHTML = '';
        }

        const el = document.getElementById('week-cards');
        el.innerHTML = '';

        if (total === 0) {
          const p = document.createElement('p');
          p.className = 'no-data';
          p.textContent = 'No data for this week.';
          el.appendChild(p);
          document.getElementById('week-chart').innerHTML = '';
          return;
        }

        const frag = document.createDocumentFragment();
        for (const [desktop, secs] of Object.entries(aggData).sort(([a],[b]) => a.localeCompare(b))) {
          const meta = tracked > 1
            ? `avg/day ${formatTime(Math.round(secs / tracked))} · ${tracked} days`
            : null;
          frag.appendChild(makeCard(desktop, secs, total, meta, getTargetH(wpw, desktop)));
        }
        el.appendChild(frag);

        // Bar chart: per-bar target tick + fade for missed past days.
        const vis          = activeFilter.size > 0 ? [...activeFilter] : allDesktops();
        const dailyTgtSecs = vis.reduce((s,d) => s + (getTargetH(1, d) || 0), 0) * 3600;
        const LABELS       = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
        const today        = todayStr();
        renderBarChart(
          document.getElementById('week-chart'),
          days.map((d, i) => ({
            label:      LABELS[i],
            totals:     applyFilter(globalData[d] || {}),
            isSelected: d === sel,
            target:     (targetConfig.excludeWeekends && isWeekend(d)) ? 0 : dailyTgtSecs,
            isPast:     d < today,
          })),
          false
        );
      }

      // ── Render: Month ─────────────────────────────────────────────────
      function renderMonth(sel) {
        const [y, m] = sel.split('-').map(Number);
        const days   = getMonthDays(sel);

        // Working days in this month
        const workDaysInMonth = targetConfig.excludeWeekends
          ? days.filter(d => !isWeekend(d)).length
          : days.length;

        // Aggregate all days for display
        const aggData = {};
        for (const d of days)
          for (const [k, v] of Object.entries(applyFilter(globalData[d] || {})))
            aggData[k] = (aggData[k] || 0) + v;

        // Aggregate working days only for target progress
        const wdData = {};
        for (const d of days) {
          if (targetConfig.excludeWeekends && isWeekend(d)) continue;
          for (const [k, v] of Object.entries(applyFilter(globalData[d] || {})))
            wdData[k] = (wdData[k] || 0) + v;
        }

        const total   = Object.values(aggData).reduce((s,v) => s+v, 0);
        const tracked = trackedCount(days);

        // Tracked weeks (weekends excluded from consideration if setting on)
        const trackedWeeks = (() => {
          const weeks = new Set();
          for (const d of days) {
            if (targetConfig.excludeWeekends && isWeekend(d)) continue;
            const vals = Object.values(applyFilter(globalData[d] || {}));
            if (vals.reduce((s,x) => s+x, 0) > 0) {
              const dt = new Date(d + 'T00:00:00');
              const mon = new Date(dt);
              mon.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
              weeks.add(mon.toISOString().slice(0, 10));
            }
          }
          return weeks.size;
        })();

        document.getElementById('month-sublabel').textContent =
          new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
        document.getElementById('month-total').textContent =
          total > 0 ? `Total: ${formatTime(total)}` : '';

        // Section header target aggregate
        const dWithTgt = Object.keys(wdData).filter(d => (targetConfig.desktops?.[d] || 0) > 0);
        if (dWithTgt.length > 0) {
          renderTargetRow(document.getElementById('month-target'),
            dWithTgt.reduce((s,d) => s + (wdData[d] || 0), 0),
            dWithTgt.reduce((s,d) => s + getTargetH(workDaysInMonth, d), 0)
          );
        } else {
          document.getElementById('month-target').innerHTML = '';
        }

        const el = document.getElementById('month-cards');
        el.innerHTML = '';

        if (total === 0) {
          const p = document.createElement('p');
          p.className = 'no-data';
          p.textContent = 'No data for this month.';
          el.appendChild(p);
          document.getElementById('month-chart').innerHTML = '';
          return;
        }

        const frag = document.createDocumentFragment();
        for (const [desktop, secs] of Object.entries(aggData).sort(([a],[b]) => a.localeCompare(b))) {
          const meta = tracked > 1
            ? [
                `avg/day ${formatTime(Math.round(secs / tracked))}`,
                ...(trackedWeeks > 1 ? [`avg/week ${formatTime(Math.round(secs / trackedWeeks))}`] : []),
                `${tracked} days`,
              ]
            : null;
          frag.appendChild(makeCard(desktop, secs, total, meta, getTargetH(workDaysInMonth, desktop)));
        }
        el.appendChild(frag);

        // Bar chart: per-bar target tick + fade for missed past days.
        const vis          = activeFilter.size > 0 ? [...activeFilter] : allDesktops();
        const dailyTgtSecs = vis.reduce((s,d) => s + (getTargetH(1, d) || 0), 0) * 3600;
        const today        = todayStr();
        renderBarChart(
          document.getElementById('month-chart'),
          days.map(d => ({
            label:      String(parseInt(d.split('-')[2])),
            totals:     applyFilter(globalData[d] || {}),
            isSelected: d === sel,
            target:     (targetConfig.excludeWeekends && isWeekend(d)) ? 0 : dailyTgtSecs,
            isPast:     d < today,
          })),
          true
        );
      }

      // ── Master render ─────────────────────────────────────────────────
      function syncTodayBtn() {
        document.getElementById('go-today').disabled =
          document.getElementById('date-picker').value === todayStr();
      }

      function stepDay(delta) {
        const picker = document.getElementById('date-picker');
        const d = new Date((picker.value || todayStr()) + 'T00:00:00');
        d.setDate(d.getDate() + delta);
        picker.value = d.getFullYear() + '-' +
          String(d.getMonth() + 1).padStart(2, '0') + '-' +
          String(d.getDate()).padStart(2, '0');
        renderAll();
      }

      function renderAll() {
        const picker = document.getElementById('date-picker');
        if (!picker.value) {
          const d = new Date();
          picker.value = d.getFullYear() + '-' +
            String(d.getMonth() + 1).padStart(2, '0') + '-' +
            String(d.getDate()).padStart(2, '0');
        }
        buildColorMap();
        renderDay(picker.value);
        renderWeek(picker.value);
        renderMonth(picker.value);
        syncTodayBtn();
        syncAdjustDate();
      }

      // Keep the "Adjust Time" date in the settings panel matched to the
      // main date picker while the settings panel is open.
      function syncAdjustDate() {
        const panel = document.getElementById('settings-panel');
        if (!panel.classList.contains('open')) return;
        const picker  = document.getElementById('date-picker');
        const adjDate = document.getElementById('adj-date');
        if (adjDate.value !== picker.value) {
          adjDate.value = picker.value;
          buildAdjustDropdowns();
        }
      }

      async function fetchAndRenderData() {
        try {
          const r = await fetch('desktop_data.json?t=' + Date.now());
          globalData = await r.json();
        } catch {
          document.getElementById('day-cards').innerHTML =
            '<p style="color:#ef4444">Error loading data.</p>';
          return;
        }
        renderAll();
      }

      // ── Targets ───────────────────────────────────────────────────────
      let targetConfig = (() => {
        try { return JSON.parse(localStorage.getItem('dt_target') || '{}'); }
        catch { return {}; }
      })();

      function saveTargetConfig(c) {
        targetConfig = c;
        localStorage.setItem('dt_target', JSON.stringify(c));
      }

      function isWeekend(dateStr) {
        const d = new Date(dateStr + 'T00:00:00').getDay();
        return d === 0 || d === 6;
      }

      // Extrapolate a per-desktop target to any period via a daily rate.
      // desktop = name of the desktop; numWorkDays = working days in the period.
      // Returns hours, or null if no target is set for that desktop.
      function getTargetH(numWorkDays, desktop) {
        const v = targetConfig.desktops?.[desktop];
        const t = targetConfig.targetType;
        if (!v || v <= 0 || !t) return null;
        const wpw = targetConfig.excludeWeekends ? 5 : 7;
        let daily;
        if      (t === 'day')  daily = v;
        else if (t === 'week') daily = v / wpw;
        else                   daily = v / (52 * wpw / 12);
        return daily * numWorkDays;
      }

      function fmtH(h) {
        if (!h) return '';
        const r = Math.round(h * 10) / 10;
        return Number.isInteger(r) ? `${r}h` : `${r}h`;
      }

      function renderTargetRow(el, trackedSecs, targetH) {
        el.innerHTML = '';
        if (!targetH || targetH <= 0) return;
        const targetSecs = targetH * 3600;
        const pct  = Math.min(100, (trackedSecs / targetSecs) * 100);
        const over = trackedSecs >= targetSecs;

        const wrap = document.createElement('div');
        wrap.className = 'target-bar-wrap';
        const fill = document.createElement('div');
        fill.className = 'target-bar-fill' + (over ? ' over' : '');
        fill.style.width = pct.toFixed(1) + '%';
        wrap.appendChild(fill);

        const txt = document.createElement('div');
        txt.className = 'target-text';
        if (over) {
          const span = document.createElement('span');
          span.className = 'target-over';
          span.textContent = `✓ ${formatTime(Math.round(trackedSecs))}`;
          txt.appendChild(span);
          txt.appendChild(document.createTextNode(
            ` — ${formatTime(Math.round(trackedSecs - targetSecs))} over ${fmtH(targetH)} target`
          ));
        } else {
          txt.textContent =
            `${formatTime(Math.round(trackedSecs))} of ${fmtH(targetH)} target` +
            ` · ${Math.round(pct)}%` +
            ` · ${formatTime(Math.round(targetSecs - trackedSecs))} to go`;
        }
        el.appendChild(wrap);
        el.appendChild(txt);
      }

      // ── Desktop filter ────────────────────────────────────────────────
      let activeFilter = new Set(); // empty = show all desktops

      function applyFilter(map) {
        if (activeFilter.size === 0) return map;
        return Object.fromEntries(
          Object.entries(map).filter(([k]) => activeFilter.has(k))
        );
      }

      function allDesktops() {
        return [...new Set(
          Object.values(globalData).flatMap(d => Object.keys(d))
        )].sort();
      }

      function buildFilterOptions() {
        const desktops = allDesktops();
        const showAll  = activeFilter.size === 0;
        const allCb    = document.getElementById('filter-all');
        allCb.checked       = showAll;
        allCb.indeterminate = !showAll && activeFilter.size < desktops.length;

        const container = document.getElementById('filter-options');
        container.innerHTML = '';
        for (const desktop of desktops) {
          const lbl = document.createElement('label');
          lbl.className = 'filter-opt';
          const cb = document.createElement('input');
          cb.type    = 'checkbox';
          cb.value   = desktop;
          cb.checked = showAll || activeFilter.has(desktop);
          cb.addEventListener('change', onFilterChange);
          lbl.appendChild(cb);
          lbl.appendChild(document.createTextNode(desktop));
          container.appendChild(lbl);
        }
      }

      function onFilterChange() {
        const cbs     = [...document.querySelectorAll('#filter-options input')];
        const checked = cbs.filter(c => c.checked).map(c => c.value);
        activeFilter  = checked.length === cbs.length ? new Set() : new Set(checked);
        const allCb   = document.getElementById('filter-all');
        allCb.checked       = activeFilter.size === 0;
        allCb.indeterminate = activeFilter.size > 0 && activeFilter.size < cbs.length;
        updateFilterBtn();
        renderAll();
      }

      document.getElementById('filter-all').addEventListener('change', function () {
        // "All" toggled — if it was indeterminate or unchecked, restore to all-selected
        activeFilter = new Set();
        this.checked       = true;
        this.indeterminate = false;
        for (const cb of document.querySelectorAll('#filter-options input'))
          cb.checked = true;
        updateFilterBtn();
        renderAll();
      });

      function updateFilterBtn() {
        const btn      = document.getElementById('filter-btn');
        const desktops = allDesktops();
        if (activeFilter.size === 0) {
          btn.textContent = 'All Desktops ▾';
          btn.classList.remove('active');
        } else if (activeFilter.size === 1) {
          btn.textContent = `${[...activeFilter][0]} ▾`;
          btn.classList.add('active');
        } else {
          btn.textContent = `${activeFilter.size} of ${desktops.length} ▾`;
          btn.classList.add('active');
        }
      }

      document.getElementById('filter-btn').addEventListener('click', e => {
        e.stopPropagation();
        const panel = document.getElementById('filter-panel');
        const opening = !panel.classList.contains('open');
        panel.classList.toggle('open');
        if (opening) buildFilterOptions();
      });

      document.addEventListener('click', e => {
        if (!document.getElementById('filter-wrap').contains(e.target))
          document.getElementById('filter-panel').classList.remove('open');
      });

      // ── Targets panel ────────────────────────────────────────────────
      function buildTargetDesktopRows() {
        const desktops  = allDesktops();
        const container = document.getElementById('t-desktop-rows');
        container.innerHTML = '';
        if (desktops.length === 0) {
          const msg = document.createElement('p');
          msg.className = 'no-data';
          msg.textContent = 'No desktops tracked yet.';
          container.appendChild(msg);
          return;
        }
        const frag = document.createDocumentFragment();
        for (const desktop of desktops) {
          const row = document.createElement('div');
          row.className = 'target-desktop-row';
          const lbl = document.createElement('span');
          lbl.className = 'target-desktop-label';
          lbl.textContent = desktop;
          const inp = document.createElement('input');
          inp.type = 'number'; inp.min = '0'; inp.step = '0.5';
          inp.placeholder = '—'; inp.className = 'target-desktop-input';
          inp.dataset.desktop = desktop;
          const v = targetConfig.desktops?.[desktop];
          inp.value = (v && v > 0) ? v : '';
          const unit = document.createElement('span');
          unit.className = 'target-desktop-unit';
          unit.textContent = 'h';
          row.appendChild(lbl); row.appendChild(inp); row.appendChild(unit);
          frag.appendChild(row);
        }
        container.appendChild(frag);
      }

      function loadTargetsIntoPanel() {
        document.getElementById('t-type').value       = targetConfig.targetType  || 'week';
        document.getElementById('t-weekends').checked = !!targetConfig.excludeWeekends;
        buildTargetDesktopRows();
      }

      // ── Adjust Time panel ────────────────────────────────────────────
      let adjMode = 'transfer'; // 'transfer' | 'add'

      function setAdjMode(mode) {
        adjMode = mode;
        document.getElementById('adj-mode-transfer').classList.toggle('active', mode === 'transfer');
        document.getElementById('adj-mode-add').classList.toggle('active', mode === 'add');
        document.getElementById('adj-from-row').style.display = mode === 'transfer' ? '' : 'none';
        document.getElementById('adj-to-label').textContent   = mode === 'transfer' ? 'To' : 'Desktop';
        document.getElementById('adj-move').textContent       = mode === 'transfer' ? 'Move' : 'Add';
        document.getElementById('adj-status').textContent = '';
        document.getElementById('adj-status').className   = 'settings-status';
        buildAdjustDropdowns();
      }

      function buildAdjustDropdowns() {
        const date    = document.getElementById('adj-date').value;
        const day     = globalData[date] || {};
        const fromSel = document.getElementById('adj-from');
        const toSel   = document.getElementById('adj-to');
        fromSel.innerHTML = '';
        toSel.innerHTML   = '';

        const fromOptions = Object.keys(day).filter(d => day[d] > 0).sort();
        if (fromOptions.length === 0) {
          const opt = document.createElement('option');
          opt.value = ''; opt.textContent = '— no tracked desktops on this date —';
          fromSel.appendChild(opt);
        } else {
          for (const d of fromOptions) {
            const opt = document.createElement('option');
            opt.value = d; opt.textContent = `${d} (${formatTime(day[d])})`;
            fromSel.appendChild(opt);
          }
        }

        const allKnown = [...new Set(
          Object.values(globalData).flatMap(o => Object.keys(o))
        )].sort();
        for (const d of allKnown) {
          const opt = document.createElement('option');
          opt.value = d; opt.textContent = d;
          toSel.appendChild(opt);
        }
      }

      function loadAdjustIntoPanel() {
        document.getElementById('adj-date').value    = document.getElementById('date-picker').value;
        document.getElementById('adj-minutes').value = '';
        document.getElementById('adj-status').textContent = '';
        document.getElementById('adj-status').className   = 'settings-status';
        buildAdjustDropdowns();
      }

      document.getElementById('adj-mode-transfer').addEventListener('click', () => setAdjMode('transfer'));
      document.getElementById('adj-mode-add').addEventListener('click',      () => setAdjMode('add'));
      document.getElementById('adj-date').addEventListener('change', () => {
        const picker  = document.getElementById('date-picker');
        const adjDate = document.getElementById('adj-date').value;
        if (picker.value !== adjDate) {
          picker.value = adjDate;
          renderAll();
        }
        buildAdjustDropdowns();
      });

      document.getElementById('adj-move').addEventListener('click', async () => {
        const date     = document.getElementById('adj-date').value;
        const to       = document.getElementById('adj-to').value;
        const minutes  = parseFloat(document.getElementById('adj-minutes').value);
        const statusEl = document.getElementById('adj-status');

        function err(msg) {
          statusEl.textContent = msg;
          statusEl.className   = 'settings-status status-error';
        }

        if (isNaN(minutes) || minutes <= 0) return err('Minutes must be positive.');

        if (adjMode === 'add') {
          if (!date || !to) return err('Fill in all fields.');
          try {
            const r = await fetch('/api/add-time', {
              method:  'POST',
              headers: { 'Content-Type': 'application/json' },
              body:    JSON.stringify({ date, desktop: to, minutes }),
            });
            const result = await r.json();
            if (r.ok) {
              statusEl.textContent = `Added ${minutes}m to ${to}`;
              statusEl.className   = 'settings-status status-ok';
              document.getElementById('adj-minutes').value = '';
              await fetchAndRenderData();
              buildAdjustDropdowns();
            } else {
              err(result.error || 'Add failed.');
            }
          } catch (e) {
            err('Network error.');
          }
        } else {
          const from = document.getElementById('adj-from').value;
          if (!date || !from || !to) return err('Fill in all fields.');
          if (from === to)            return err('From and To must differ.');
          try {
            const r = await fetch('/api/adjust', {
              method:  'POST',
              headers: { 'Content-Type': 'application/json' },
              body:    JSON.stringify({ date, from, to, minutes }),
            });
            const result = await r.json();
            if (r.ok) {
              statusEl.textContent = `Moved ${minutes}m · ${from} → ${to}`;
              statusEl.className   = 'settings-status status-ok';
              document.getElementById('adj-minutes').value = '';
              await fetchAndRenderData();
              buildAdjustDropdowns();
            } else {
              err(result.error || 'Adjust failed.');
            }
          } catch (e) {
            err('Network error.');
          }
        }
      });

      document.getElementById('targets-save').addEventListener('click', () => {
        const desktops = {};
        for (const inp of document.querySelectorAll('.target-desktop-input')) {
          const v = parseFloat(inp.value);
          desktops[inp.dataset.desktop] = (!isNaN(v) && v > 0) ? v : null;
        }
        saveTargetConfig({
          targetType:      document.getElementById('t-type').value,
          excludeWeekends: document.getElementById('t-weekends').checked,
          desktops,
        });
        const saved = document.getElementById('targets-saved');
        saved.style.display = 'inline';
        setTimeout(() => { saved.style.display = 'none'; }, 1500);
        renderAll();
      });

      // ── CSV export ────────────────────────────────────────────────────
      function csvEscape(v) {
        const s = String(v);
        return /[,"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }

      document.getElementById('export-btn').addEventListener('click', () => {
        const rows = ['Date,Desktop,Total Seconds,Formatted Time'];
        for (const [date, desktops] of Object.entries(globalData))
          for (const [desktop, secs] of Object.entries(desktops))
            rows.push(`${csvEscape(date)},${csvEscape(desktop)},${secs},${csvEscape(formatTime(secs))}`);
        const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = 'desktop_time_export.csv';
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      });

      document.getElementById('date-picker').addEventListener('change', renderAll);
      document.getElementById('prev-day').addEventListener('click', () => stepDay(-1));
      document.getElementById('next-day').addEventListener('click', () => stepDay(1));
      document.getElementById('go-today').addEventListener('click', () => {
        document.getElementById('date-picker').value = todayStr();
        renderAll();
      });
      loadBhConfig().then(() => fetchAndRenderData());
      setInterval(fetchAndRenderData, 10000);

      // ── BambooHR Settings ─────────────────────────────────────────────
      let bhProjects = [];
      let bhMappings = {};

      document.getElementById('settings-btn').addEventListener('click', () => {
        const panel  = document.getElementById('settings-panel');
        const isOpen = panel.classList.toggle('open');
        if (isOpen) {
          loadTargetsIntoPanel();
          loadAdjustIntoPanel();
          loadSettingsPanel();
        }
      });

      document.getElementById('bh-reveal').addEventListener('click', () => {
        const f = document.getElementById('bh-apikey');
        f.type = f.type === 'password' ? 'text' : 'password';
      });

      async function loadSettingsPanel() {
        try {
          const cfg = await fetch('/api/bamboohr/config').then(r => r.json());
          document.getElementById('bh-domain').value = cfg.company_domain || '';
          const keyField = document.getElementById('bh-apikey');
          keyField.value = '';
          keyField.placeholder = cfg.api_key === '****'
            ? 'Key is saved — enter a new key to change it'
            : 'Your BambooHR API key';
          bhMappings = cfg.mappings || {};
          document.getElementById('bh-rounding').value = cfg.rounding || '15min';
          if (cfg.company_domain && cfg.api_key === '****') {
            await fetchProjects(false);
          } else {
            renderMappings();
          }
        } catch (e) {
          bhStatus('Could not load settings.', 'error');
        }
      }

      document.getElementById('bh-save-creds').addEventListener('click', async () => {
        const domain   = document.getElementById('bh-domain').value.trim();
        const key      = document.getElementById('bh-apikey').value.trim();
        const rounding = document.getElementById('bh-rounding').value;
        const body     = { company_domain: domain, rounding };
        if (key) body.api_key = key;
        try {
          const r = await fetch('/api/bamboohr/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (r.ok) {
            bhStatus('Settings saved.', 'ok');
            const keyField = document.getElementById('bh-apikey');
            keyField.value = '';
            keyField.placeholder = 'Key is saved — enter a new key to change it';
          } else {
            bhStatus('Failed to save.', 'error');
          }
        } catch (e) {
          bhStatus('Network error.', 'error');
        }
      });

      document.getElementById('bh-test').addEventListener('click', () => fetchProjects(true));

      async function fetchProjects(verbose) {
        if (verbose) bhStatus('Connecting…', 'info');
        try {
          const r = await fetch('/api/bamboohr/projects');
          if (r.ok) {
            bhProjects = await r.json();
            if (verbose) bhStatus(
              `Connected — ${bhProjects.length} project${bhProjects.length !== 1 ? 's' : ''} loaded.`,
              'ok'
            );
            document.getElementById('mapping-section').style.display = '';
            renderMappings();
          } else {
            const err = await r.json().catch(() => ({}));
            if (verbose) bhStatus(`Connection failed: ${err.error || r.status}`, 'error');
            document.getElementById('mapping-section').style.display = 'none';
          }
        } catch (e) {
          if (verbose) bhStatus('Network error.', 'error');
        }
      }

      // Build (or rebuild) the task dropdown for a given project. Hidden when
      // the project has no tasks. Returns the rendered <select>.
      function buildTaskOptions(taskSel, projectId, selectedTaskId) {
        taskSel.innerHTML = '';
        const proj  = bhProjects.find(p => String(p.id) === String(projectId));
        const tasks = (proj && proj.tasks) || [];
        if (tasks.length === 0) {
          taskSel.style.display = 'none';
          return;
        }
        taskSel.style.display = '';
        const skip = document.createElement('option');
        skip.value = ''; skip.textContent = '— select task —';
        taskSel.appendChild(skip);
        for (const task of tasks) {
          const opt = document.createElement('option');
          opt.value = String(task.id); opt.textContent = task.name;
          if (String(selectedTaskId) === String(task.id)) opt.selected = true;
          taskSel.appendChild(opt);
        }
      }

      function renderMappings() {
        const desktops = [...new Set(
          Object.values(globalData).flatMap(d => Object.keys(d))
        )].sort();
        const rows = document.getElementById('mapping-rows');
        rows.innerHTML = '';
        if (desktops.length === 0) { rows.textContent = 'No desktops tracked yet.'; return; }
        const frag = document.createDocumentFragment();
        for (const desktop of desktops) {
          const row = document.createElement('div');
          row.className = 'mapping-row';
          const lbl = document.createElement('span');
          lbl.className = 'mapping-label';
          lbl.textContent = desktop;

          // Mapping may be a bare project ID (legacy) or {projectId, taskId?}.
          const m = bhMappings[desktop];
          const curProjectId = (m && typeof m === 'object') ? m.projectId : m;
          const curTaskId    = (m && typeof m === 'object') ? m.taskId    : null;

          const projSel = document.createElement('select');
          projSel.className = 'mapping-select';
          projSel.dataset.desktop = desktop;
          projSel.dataset.role    = 'project';
          const skip = document.createElement('option');
          skip.value = ''; skip.textContent = '— skip —';
          projSel.appendChild(skip);
          for (const proj of bhProjects) {
            const opt = document.createElement('option');
            opt.value = String(proj.id); opt.textContent = proj.name;
            if (String(curProjectId) === String(proj.id)) opt.selected = true;
            projSel.appendChild(opt);
          }

          const taskSel = document.createElement('select');
          taskSel.className = 'mapping-select';
          taskSel.dataset.desktop = desktop;
          taskSel.dataset.role    = 'task';
          buildTaskOptions(taskSel, curProjectId, curTaskId);

          projSel.addEventListener('change', () => {
            buildTaskOptions(taskSel, projSel.value, '');
          });

          row.appendChild(lbl);
          row.appendChild(projSel);
          row.appendChild(taskSel);
          frag.appendChild(row);
        }
        rows.appendChild(frag);
        if (bhProjects.length > 0) document.getElementById('mapping-section').style.display = '';
      }

      document.getElementById('bh-save-mappings').addEventListener('click', async () => {
        // Validate that any project requiring tasks has one selected.
        const missingTask = [];
        const mappings   = {};
        for (const row of document.querySelectorAll('#mapping-rows .mapping-row')) {
          const projSel = row.querySelector('select[data-role="project"]');
          const taskSel = row.querySelector('select[data-role="task"]');
          const desktop = projSel.dataset.desktop;
          const pid     = projSel.value;
          if (!pid) { mappings[desktop] = null; continue; }
          const proj   = bhProjects.find(p => String(p.id) === pid);
          const hasTasks = proj && proj.tasks && proj.tasks.length > 0;
          const tid    = taskSel.value;
          if (hasTasks && !tid) { missingTask.push(desktop); continue; }
          mappings[desktop] = tid
            ? { projectId: parseInt(pid, 10), taskId: parseInt(tid, 10) }
            : { projectId: parseInt(pid, 10) };
        }
        if (missingTask.length > 0) {
          bhMapStatus(`Select a task for: ${missingTask.join(', ')}`, 'error');
          return;
        }
        bhMappings = mappings;
        try {
          const r = await fetch('/api/bamboohr/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mappings }),
          });
          bhMapStatus(r.ok ? 'Mappings saved.' : 'Failed to save mappings.',
                      r.ok ? 'ok' : 'error');
        } catch (e) { bhMapStatus('Network error.', 'error'); }
      });

      // ── Sync button ─────────────────────────────────────────────────────
      let bhConfig = null;

      async function loadBhConfig() {
        try {
          bhConfig = await fetch('/api/bamboohr/config').then(r => r.json());
        } catch (e) {
          bhConfig = null;
        }
      }

      function updateSyncUI(selectedDate) {
        const btn       = document.getElementById('sync-btn');
        const statusEl  = document.getElementById('sync-status');
        const configured = bhConfig &&
                           bhConfig.company_domain &&
                           bhConfig.api_key === '****';

        btn.style.display = configured ? '' : 'none';
        if (!configured) { statusEl.textContent = ''; return; }

        const info = (bhConfig.synced_dates || {})[selectedDate];
        if (info) {
          const ts      = new Date(info.timestamp);
          const dateStr = ts.toLocaleDateString(undefined,
                          { month: 'short', day: 'numeric' });
          const timeStr = ts.toLocaleTimeString(undefined,
                          { hour: 'numeric', minute: '2-digit' });
          const label   = info.status === 'partial' ? '⚠ Partial' : '✓ Synced';
          statusEl.textContent = `${label} ${dateStr} at ${timeStr}`;
          statusEl.className   = `sync-status ${info.status === 'ok' ? 'ok' : 'partial'}`;
        } else {
          statusEl.textContent = 'Not synced';
          statusEl.className   = 'sync-status';
        }
      }

      document.getElementById('sync-btn').addEventListener('click', async () => {
        const date = document.getElementById('date-picker').value;
        if (!date) return;

        // Warn about unmapped desktops before syncing.
        const dayData  = globalData[date] || {};
        const mappings = bhConfig?.mappings || {};
        const unmapped = Object.keys(dayData)
          .filter(d => dayData[d] > 0 && !mappings[d]);

        if (unmapped.length > 0) {
          const proceed = confirm(
            `These desktops have no BambooHR project mapped and will be skipped:\n\n` +
            unmapped.map(d => `  • ${d}`).join('\n') +
            `\n\nProceed with sync?`
          );
          if (!proceed) return;
        }

        const btn      = document.getElementById('sync-btn');
        const statusEl = document.getElementById('sync-status');
        btn.disabled        = true;
        btn.textContent     = 'Syncing…';
        statusEl.textContent = '';
        statusEl.className  = 'sync-status';

        try {
          const r      = await fetch('/api/bamboohr/sync', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ date }),
          });
          const result = await r.json();

          if (r.ok) {
            await loadBhConfig();
            updateSyncUI(date);
            const n   = result.synced?.length  || 0;
            const sk  = result.skipped?.length || 0;
            const err = result.errors?.length  || 0;
            let msg = `✓ ${n} entr${n !== 1 ? 'ies' : 'y'} synced`;
            if (sk)  msg += ` · ${sk} skipped`;
            if (err) msg += ` · ${err} failed`;
            statusEl.textContent = msg;
            statusEl.className   = err ? 'sync-status partial' : 'sync-status ok';
          } else {
            statusEl.textContent = `✗ ${result.error || 'Sync failed'}`;
            statusEl.className   = 'sync-status err';
          }
        } catch (e) {
          statusEl.textContent = '✗ Network error';
          statusEl.className   = 'sync-status err';
        } finally {
          btn.disabled    = false;
          btn.textContent = 'Sync to BambooHR';
        }
      });

      // Reload config when settings are saved so sync button appears immediately.
      document.getElementById('bh-save-creds').addEventListener('click',
        () => loadBhConfig(), { capture: true }
      );

      function bhStatus(msg, type) {
        const el = document.getElementById('bh-status');
        el.textContent = msg;
        el.className = `settings-status status-${type}`;
      }

      function bhMapStatus(msg, type) {
        const el = document.getElementById('bh-map-status');
        el.textContent = msg;
        el.className = `settings-status status-${type}`;
      }
    </script>
